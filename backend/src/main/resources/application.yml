spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  mvc:
    problem-details:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:15MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:20MB}
  application:
    name: studentprep-backend
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${JPA_FORMAT_SQL:false}
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT:6379}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  credential-vault:
    key: ${CREDENTIAL_ENCRYPTION_KEY:local_dev_credential_vault_key_change_in_prod}
  cookie:
    secure: ${APP_COOKIE_SECURE:${COOKIE_SECURE:true}}
    same-site: ${COOKIE_SAME_SITE:Strict}
  bootstrap:
    admin-secret: ${ADMIN_BOOTSTRAP_SECRET:}
  rate-limit:
    login-max-failures-per-identifier: ${RATE_LIMIT_LOGIN_MAX_FAILURES:5}
    login-lockout-minutes: ${RATE_LIMIT_LOGIN_LOCKOUT_MINUTES:15}
    login-max-per-ip-per-minute: ${RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE:60}
    refresh-max-per-ip-per-minute: ${RATE_LIMIT_REFRESH_PER_IP_PER_MINUTE:30}
    refresh-max-per-subject-per-minute: ${RATE_LIMIT_REFRESH_PER_SUBJECT_PER_MINUTE:15}
    sync-max-per-student-per-minute: ${RATE_LIMIT_SYNC_PER_STUDENT_PER_MINUTE:10}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  public-base-url: ${S3_PUBLIC_BASE_URL:${S3_ENDPOINT:http://localhost:9000}}
  accessKey: ${S3_ACCESS_KEY:minioadmin}
  secretKey: ${S3_SECRET_KEY:minioadmin}
  bucket: ${S3_BUCKET:studentprep-assets}

docling:
  parser:
    url: ${DOCLING_PARSER_URL:http://localhost:8000}
    timeout-ms: ${DOCLING_TIMEOUT_MS:60000}
  api-key: ${DOCLING_API_KEY:}

gemini:
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  api-key: ${LLM_API_KEY:}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}
    include-stacktrace: never
