name: StudentPrep CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-modulith-tests:
    name: Backend Modulith & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Verify (Modulith Tests)
        run: mvn clean verify

  frontend-e2e-tests:
    name: Frontend Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment Variables
        run: cp .env.example .env

      - name: Start Infrastructure (Docker Compose)
        run: docker compose up -d postgres redis minio

      - name: Wait for Infrastructure
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout 60 bash -c 'while ! docker compose exec -T postgres pg_isready -U postgres; do sleep 2; done'
          echo "PostgreSQL is ready!"

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Spring Boot Backend
        working-directory: ./backend
        run: |
          nohup mvn spring-boot:run > ../spring-boot.log 2>&1 &
          echo $! > ../spring-boot.pid
        
      - name: Wait for Backend
        run: |
          echo "Waiting for Spring Boot to start on port 8080..."
          timeout 180 bash -c 'while ! nc -z localhost 8080; do sleep 3; done'
          echo "Backend is up!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run Playwright Tests (Offline Resilience & Tab Switching)
        working-directory: ./frontend
        run: npx playwright test

      - name: Dump Spring Boot Logs on Failure
        if: failure()
        run: |
          echo "=== Spring Boot Logs ==="
          cat spring-boot.log || echo "No log file found"
          echo "=== Docker Compose Logs ==="
          docker compose logs --tail=50
