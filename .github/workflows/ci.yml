name: StudentPrep CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-modulith-tests:
    name: Backend Modulith & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Verify (Modulith Tests)
        run: mvn clean verify

  frontend-e2e-tests:
    name: Frontend Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment Variables
        run: cp .env.example .env

      - name: Start Infrastructure (Docker Compose)
        run: docker-compose up -d

      - name: Wait for Infrastructure
        run: sleep 15

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run Playwright Tests (Offline Resilience & Tab Switching)
        working-directory: ./frontend
        run: npx playwright test
