<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008751"/>
      <stop offset="100%" stop-color="#005a36"/>
    </linearGradient>
    <filter id="pwa-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="192" height="192" rx="42" fill="url(#pwa-grad)"/>

  <!-- Icon Graphic: Graduation Cap & Assessment Sheet -->
  <g filter="url(#pwa-shadow)">
    <!-- Graduation Cap Board -->
    <path d="M 96 46 L 154 74 L 96 102 L 38 74 Z" fill="#ffffff"/>
    
    <!-- Cap Underneath Base -->
    <path d="M 64 87 L 64 116 C 64 128, 128 128, 128 116 L 128 87" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Tassel -->
    <path d="M 142 80 L 148 108" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
    <circle cx="148" cy="112" r="4" fill="#facc15"/>

    <!-- Exam / CBT Shield Mark -->
    <path d="M 80 134 L 96 150 L 122 124" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
