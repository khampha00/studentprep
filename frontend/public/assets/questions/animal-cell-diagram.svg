<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#f8fafc"/>
  <rect x="10" y="10" width="580" height="380" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="300" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Diagram of a Typical Animal Cell</text>

  <!-- Cell Membrane & Cytoplasm -->
  <path d="M 120 180 C 100 100, 220 70, 340 80 C 460 90, 520 150, 500 240 C 480 330, 380 350, 260 345 C 140 340, 140 260, 120 180 Z" 
        fill="#ecfdf5" stroke="#059669" stroke-width="4" filter="url(#shadow)"/>

  <!-- Endoplasmic Reticulum (around Nucleus) -->
  <path d="M 210 140 C 180 150, 180 250, 210 260" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <path d="M 195 150 C 165 165, 165 235, 195 250" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>

  <!-- Organelle X: Nucleus -->
  <ellipse cx="270" cy="200" rx="65" ry="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <!-- Nucleolus -->
  <ellipse cx="265" cy="195" rx="24" ry="22" fill="#1e40af"/>
  <!-- Chromatin lines -->
  <path d="M 240 180 Q 255 170 250 160 M 290 180 Q 300 200 285 220 M 235 215 Q 250 230 240 240" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- Mitochondria 1 -->
  <g transform="translate(400, 240) rotate(-25)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <path d="M -22 -10 Q -15 0 -22 10 M -8 -12 Q 0 0 -8 12 M 6 -12 Q 14 0 6 12 M 20 -10 Q 25 0 20 10" fill="none" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Mitochondria 2 -->
  <g transform="translate(180, 290) rotate(15)">
    <rect x="-30" y="-15" width="60" height="30" rx="15" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <path d="M -18 -8 Q -12 0 -18 8 M -6 -10 Q 0 0 -6 10 M 6 -10 Q 12 0 6 10 M 18 -8 Q 22 0 18 8" fill="none" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Golgi Apparatus -->
  <g transform="translate(390, 140) rotate(10)">
    <path d="M -30 -15 Q 0 -25 30 -15" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <path d="M -35 -5 Q 0 -15 35 -5" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <path d="M -30 5 Q 0 -5 30 5" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-38" cy="-12" r="4" fill="#fb923c"/>
    <circle cx="38" cy="-3" r="5" fill="#fb923c"/>
    <circle cx="34" cy="8" r="3" fill="#fb923c"/>
  </g>

  <!-- Vacuole / Lysosomes -->
  <circle cx="340" cy="285" r="14" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <circle cx="330" cy="115" r="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="440" cy="185" r="7" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>

  <!-- Cytoplasm label hint -->
  <text x="475" y="325" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Cytoplasm</text>

  <!-- Pointer Line to Organelle X (Nucleus) -->
  <line x1="140" y1="85" x2="235" y2="165" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <!-- Label X Box -->
  <rect x="110" y="60" width="36" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="128" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#dc2626">X</text>
</svg>
