<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#f8fafc"/>
  <rect x="10" y="10" width="580" height="380" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Cartesian Coordinate Graph</text>

  <!-- Grid Lines (40px per unit, origin at 300, 220) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <!-- Vertical grid lines: x from -4 to 4 (140 to 460) -->
    <line x1="140" y1="50" x2="140" y2="370"/>
    <line x1="180" y1="50" x2="180" y2="370"/>
    <line x1="220" y1="50" x2="220" y2="370"/>
    <line x1="260" y1="50" x2="260" y2="370"/>
    <line x1="340" y1="50" x2="340" y2="370"/>
    <line x1="380" y1="50" x2="380" y2="370"/>
    <line x1="420" y1="50" x2="420" y2="370"/>
    <line x1="460" y1="50" x2="460" y2="370"/>

    <!-- Horizontal grid lines: y from -3 to 4 (340 down to 60) -->
    <line x1="130" y1="60" x2="470" y2="60"/>
    <line x1="130" y1="100" x2="470" y2="100"/>
    <line x1="130" y1="140" x2="470" y2="140"/>
    <line x1="130" y1="180" x2="470" y2="180"/>
    <line x1="130" y1="260" x2="470" y2="260"/>
    <line x1="130" y1="300" x2="470" y2="300"/>
    <line x1="130" y1="340" x2="470" y2="340"/>
  </g>

  <!-- Axes -->
  <!-- X-Axis -->
  <line x1="120" y1="220" x2="480" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="488" y="224" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#334155">x</text>

  <!-- Y-Axis -->
  <line x1="300" y1="380" x2="300" y2="50" stroke="#334155" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="300" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#334155">y</text>

  <!-- Axis Ticks & Labels -->
  <!-- Origin -->
  <text x="290" y="235" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="end">0</text>

  <!-- X ticks -->
  <g font-family="Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    <line x1="180" y1="216" x2="180" y2="224" stroke="#334155" stroke-width="1.5"/>
    <text x="180" y="236">-3</text>
    <line x1="220" y1="216" x2="220" y2="224" stroke="#334155" stroke-width="1.5"/>
    <text x="220" y="236">-2</text>
    <line x1="260" y1="216" x2="260" y2="224" stroke="#334155" stroke-width="1.5"/>
    <text x="260" y="236">-1</text>
    <line x1="340" y1="216" x2="340" y2="224" stroke="#334155" stroke-width="1.5"/>
    <text x="340" y="236">1</text>
    <line x1="380" y1="216" x2="380" y2="224" stroke="#334155" stroke-width="1.5"/>
    <text x="380" y="236">2</text>
    <line x1="420" y1="216" x2="420" y2="224" stroke="#334155" stroke-width="1.5"/>
    <text x="420" y="236">3</text>
  </g>

  <!-- Y ticks -->
  <g font-family="Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="end">
    <line x1="296" y1="340" x2="304" y2="340" stroke="#334155" stroke-width="1.5"/>
    <text x="292" y="344">-3</text>
    <line x1="296" y1="300" x2="304" y2="300" stroke="#334155" stroke-width="1.5"/>
    <text x="292" y="304">-2</text>
    <line x1="296" y1="260" x2="304" y2="260" stroke="#334155" stroke-width="1.5"/>
    <text x="292" y="264">-1</text>
    <line x1="296" y1="180" x2="304" y2="180" stroke="#334155" stroke-width="1.5"/>
    <text x="292" y="184">1</text>
    <line x1="296" y1="140" x2="304" y2="140" stroke="#334155" stroke-width="1.5"/>
    <text x="292" y="144">2</text>
    <line x1="296" y1="100" x2="304" y2="100" stroke="#334155" stroke-width="1.5"/>
    <text x="292" y="104">3</text>
    <line x1="296" y1="60" x2="304" y2="60" stroke="#334155" stroke-width="1.5"/>
    <text x="292" y="64">4</text>
  </g>

  <!-- The Line: y = 2x + 1 -->
  <!-- from (x=-2.375, y=-3.75 -> 205, 370) to (x=1.625, y=4.25 -> 365, 50) -->
  <line x1="205" y1="370" x2="365" y2="50" stroke="#008751" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Marked Points on the Line -->
  <!-- (-1, -1) -> (260, 260) -->
  <circle cx="260" cy="260" r="5" fill="#008751" stroke="#ffffff" stroke-width="2"/>
  <text x="250" y="275" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#008751" text-anchor="end">(-1, -1)</text>

  <!-- (0, 1) -> (300, 180) -->
  <circle cx="300" cy="180" r="5" fill="#008751" stroke="#ffffff" stroke-width="2"/>
  <text x="312" y="184" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#008751">(0, 1)</text>

  <!-- (1, 3) -> (340, 100) -->
  <circle cx="340" cy="100" r="5" fill="#008751" stroke="#ffffff" stroke-width="2"/>
  <text x="352" y="104" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#008751">(1, 3)</text>
</svg>
